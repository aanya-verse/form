<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heatwave Monitoring</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff3e0, #ffccbc);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }


        h1 {
            text-align: center;
            color: #d84315;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e64a19;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #e64a19;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #bf360c;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            text-align: center;
            border-radius: 7px;
            display: none;
        }

        .alert {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            background: #fff3e0;
            color: #e65100;
            border-radius: 7px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">


        <h1>Heatwave Monitoring</h1>

        <p class="subtitle">
            Enter weather data for monitoring
        </p>

        <form id="heatwaveForm">

            <!-- Data ID -->
            <div class="form-group">
                <label for="data_id">Data ID</label>

                <input
                    type="number"
                    id="data_id"
                    name="data_id"
                    placeholder="Enter data ID"
                    required
                >
            </div>

            <!-- City -->
            <div class="form-group">
                <label for="city">City</label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter city name"
                    maxlength="50"
                    required
                >
            </div>

            <!-- Temperature -->
            <div class="form-group">
                <label for="temp">Temperature (°C)</label>

                <input
                    type="number"
                    id="temp"
                    name="temp"
                    placeholder="Enter temperature"
                    required
                >
            </div>

            <!-- Moisture -->
            <div class="form-group">
                <label for="moisture">Moisture (%)</label>

                <input
                    type="number"
                    id="moisture"
                    name="moisture"
                    placeholder="Enter moisture"
                    min="0"
                    max="100"
                    required
                >
            </div>

            <button type="submit">
                Save Weather Data
            </button>

        </form>

        <!-- Heatwave message -->
        <div class="alert" id="alertMessage"></div>

        <!-- Success message -->
        <div id="message"></div>

    </div>


   <script>

document.getElementById("heatwaveForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let dataId = document.getElementById("data_id").value;
    let city = document.getElementById("city").value;
    let temp = document.getElementById("temp").value;
    let moisture = document.getElementById("moisture").value;

    let message = document.getElementById("message");
    let alertMessage = document.getElementById("alertMessage");

    const formData = new URLSearchParams();

    formData.append("data_id", dataId);
    formData.append("city", city);
    formData.append("temp", temp);
    formData.append("moisture", moisture);

    fetch("/saveData", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
    })

    .then(response => response.text())

    .then(data => {

        message.style.display = "block";
        message.style.background = "#e8f5e9";
        message.style.color = "#2e7d32";

        message.innerHTML = data;

        if (temp >= 40) {

            alertMessage.style.display = "block";

            alertMessage.innerHTML =
                "⚠️ HEATWAVE ALERT! " +
                city +
                " has a temperature of " +
                temp +
                "°C.";

        } else {

            alertMessage.style.display = "none";
        }

    })

    .catch(error => {

        message.style.display = "block";
        message.style.background = "#ffebee";
        message.style.color = "#c62828";

        message.innerHTML =
            "❌ Error connecting to server.";

        console.error(error);
    });

});

</script>

</body>
</html>
